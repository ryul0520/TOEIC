<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TOEIC MASTER</title>
    <meta name="theme-color" content="#2563EB">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- Firebase Compat SDK (로그인 및 클라우드 DB 연동) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary: #2563EB; 
            --bg: #F8FAFC;
            --card-dark: #1E293B;
            --star-color: #F59E0B;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        html, body {
            margin: 0; padding: 0; background-color: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", sans-serif;
            height: 100vh; height: 100dvh; overflow: hidden;
            user-select: none; -webkit-user-select: none;
            touch-action: none;
            overscroll-behavior: none; 
            transition: background-color 0.3s, color 0.3s;
        }

        /* --- 다크 모드 CSS --- */
        body.dark-mode {
            --bg: #0F172A;
            --card-dark: #1E293B;
            background-color: var(--bg);
            color: #F8FAFC;
        }
        body.dark-mode .header { background: #1E293B; border-bottom: 1px solid #334155; color: #F8FAFC; }
        body.dark-mode .header span#current-deck-title, body.dark-mode .header span#queue-count { color: #60A5FA !important; }
        body.dark-mode .header span#total-stars { background: #451A03 !important; color: #FBBF24 !important; }
        body.dark-mode .deck-card { background: #1E293B; border: 1px solid #334155; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        body.dark-mode .deck-title { color: #F8FAFC; }
        body.dark-mode .deck-info { color: #94A3B8; }
        body.dark-mode .btn-icon { background: #334155; color: #CBD5E1; }
        body.dark-mode .btn-icon.danger { background: #7F1D1D; color: #FCA5A5; }
        body.dark-mode .tool-btn { background: #1E293B; border: 1px solid #334155; color: #F8FAFC; }
        body.dark-mode .tool-btn.highlight { background: #1E3A8A; border-color: #2563EB; color: #93C5FD; }
        body.dark-mode .tool-btn.highlight[style*="background:#E0F2FE"] { background: #0C4A6E !important; border-color: #0284C7 !important; color: #38BDF8 !important; }
        body.dark-mode .tool-btn.highlight[style*="background:#FFFBEB"] { background: #78350F !important; border-color: #B45309 !important; color: #FCD34D !important; }
        body.dark-mode .session-config { background: #1E293B; border: 1px solid #334155; }
        body.dark-mode .session-config h3 { color: #60A5FA !important; }
        body.dark-mode .session-config div[style*="background:#f8fafc"] { background: #0F172A !important; border-color: #334155 !important; }
        body.dark-mode span[style*="color:#475569"], body.dark-mode label { color: #CBD5E1 !important; }
        body.dark-mode #val-display, body.dark-mode #global-val-display { color: #60A5FA !important; }
        body.dark-mode .card-front { background: #1E293B; color: #F8FAFC; border: 1px solid #334155; }
        body.dark-mode .card-back { background: #0F172A; border: 1px solid #334155; }
        body.dark-mode .nav-btn { background: #1E293B; border: 2px solid #334155; color: #CBD5E1; }
        body.dark-mode .modal-card { background: #1E293B; color: #F8FAFC; }
        body.dark-mode .modal-card h2 { color: #F8FAFC; }
        body.dark-mode .modal-action-btn.secondary { background: #334155; color: #F8FAFC; }
        body.dark-mode .modal-action-btn[style*="background:#E0F2FE"] { background: #0C4A6E !important; border-color: #0284C7 !important; color: #38BDF8 !important; }
        body.dark-mode .hint-pill { background: #1E293B; color: #94A3B8; }

        /* --- 기본 CSS --- */
        #intro-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--primary); z-index: 10000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; transition: opacity 0.4s ease-out, visibility 0.4s;
        }
        #intro-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        .page { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; z-index: 10; background: transparent; }
        .page.active { display: flex; }

        .header {
            padding: 12px 16px; background: white; display: flex; 
            justify-content: space-between; align-items: center; 
            border-bottom: 1px solid #e2e8f0; font-weight: 800;
            flex-shrink: 0; transition: background-color 0.3s, border-color 0.3s;
        }

        .content-area { 
            flex: 1; overflow-y: auto; padding: 20px; max-width: 900px; margin: 0 auto; width: 100%; 
            touch-action: pan-y;
        }

        .deck-list { display: flex; flex-direction: column; gap: 15px; }
        .deck-card {
            background: white; border: 1px solid #e2e8f0; border-radius: 16px; padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02); display: flex; flex-direction: column; gap: 15px;
            transition: background-color 0.3s, border-color 0.3s;
        }
        .deck-card-header { display: flex; justify-content: space-between; align-items: center; }
        .deck-title { font-size: 1.2rem; font-weight: 800; color: #1e293b; margin: 0; display:flex; align-items:center; gap:8px;}
        .deck-info { font-size: 0.9rem; color: #64748b; margin: 0; }
        
        .deck-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .btn-open { flex: 1; min-width: 80px; background: var(--primary); color: white; border: none; border-radius: 8px; padding: 10px; font-weight: bold; font-size: 0.95rem; cursor: pointer; text-align: center;}
        .btn-icon { background: #f1f5f9; color: #475569; border: none; border-radius: 8px; width: 40px; height: 40px; display:flex; justify-content:center; align-items:center; font-size: 1.1rem; cursor: pointer; flex-shrink: 0; padding: 0; transition: background-color 0.3s; }
        .btn-icon.danger { color: #DC2626; background: #FEE2E2; }
        .btn-icon:disabled { opacity: 0.4; cursor: not-allowed; }
        
        .tool-btn-group { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 15px; }
        .tool-btn {
            background: white; border: 1px solid #e2e8f0; border-radius: 12px;
            padding: 16px 10px; font-weight: 800; font-size: 0.9rem; color: #334155;
            cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 6px; text-align: center;
            transition: background-color 0.3s, border-color 0.3s, color 0.3s;
        }
        .tool-btn:active { transform: scale(0.98); }
        .tool-btn.highlight { border-color: var(--primary); color: var(--primary); background: #EFF6FF; }
        .tool-btn.full-width { grid-column: 1 / -1; font-size: 1.1rem; padding: 18px 10px; }
        .tool-btn.continue { background: #10B981; color: white; border: none; display: none; } 

        .session-config {
            background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px;
            border: 1px solid #e2e8f0; text-align: center; transition: background-color 0.3s, border-color 0.3s;
        }
        .session-config input[type="range"] { width: 100%; margin: 15px 0 10px 0; accent-color: var(--primary); }
        
        .learning-mode-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }

        .overlay-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 3000;
            display: none; justify-content: center; align-items: center;
        }
        .overlay-modal.visible { display: flex; }
        .modal-card {
            background: white; width: 85%; max-width: 380px;
            border-radius: 24px; padding: 36px 28px; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3); transition: background-color 0.3s;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-card .emoji { font-size: 4rem; margin-bottom: 12px; }
        .modal-card h2 { margin: 0 0 8px; font-size: 1.6rem; color: #1e293b; }
        .modal-card p { color: #64748b; font-size: 0.95rem; margin: 0 0 24px; }
        .modal-action-btn { width: 100%; padding: 14px; border-radius: 14px; border: none; font-size: 1rem; font-weight: 800; cursor: pointer; margin-bottom: 10px; transition: background-color 0.3s; }
        .modal-action-btn.primary { background: var(--primary); color: white; }
        .modal-action-btn.secondary { background: #f1f5f9; color: #334155; }
        .modal-action-btn.danger { background: #FEE2E2; color: #DC2626; }

        #game-page { touch-action: none; }
        .game-container { 
            flex: 1; display: flex; flex-direction: column; justify-content: center; 
            align-items: center; perspective: 1200px; padding-bottom: 80px; position: relative; 
            overflow: hidden;
        }
        #bg-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; opacity: 0; display: flex; justify-content: center; align-items: center; transition: opacity 0.15s; }
        #bg-icon { font-size: 15rem; font-weight: 900; opacity: 0.35; color: white; transform: scale(0.5); transition: transform 0.15s; }
        .progress-bar-wrap { position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: #e2e8f0; z-index: 10; }
        .progress-bar-fill { height: 100%; background: var(--primary); transition: width 0.3s ease; border-radius: 0 2px 2px 0; }

        .card-wrapper { width: 85%; max-width: 360px; height: 50vh; max-height: 450px; transform-style: preserve-3d; z-index: 5; touch-action: none; }
        .card-inner { width: 100%; height: 100%; position: relative; transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; }
        .card-inner.flipped { transform: rotateY(180deg); }
        .card-face { 
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden; -webkit-backface-visibility: hidden; 
            border-radius: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 25px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 1px solid rgba(0,0,0,0.05);
            transition: background-color 0.3s, border-color 0.3s;
        }
        .card-front { background: white; color: #1E293B; pointer-events: auto; }
        .card-back { background: var(--card-dark); color: white; transform: rotateY(180deg); pointer-events: none; }
        .card-inner.flipped .card-front { pointer-events: none; }
        .card-inner.flipped .card-back { pointer-events: auto; }
        
        .word { font-size: 2.5rem; font-weight: 800; margin-bottom: 8px; word-break: keep-all; overflow-wrap: anywhere; transition: font-size 0.2s; }
        .meaning { font-size: 1.8rem; font-weight: 700; color: var(--star-color); word-break: keep-all; overflow-wrap: anywhere; transition: font-size 0.2s; }
        
        .star-toggle { position: absolute; top: 20px; right: 20px; font-size: 2.2rem; color: #E2E8F0; z-index: 100; padding: 10px; cursor: pointer; }
        .star-toggle.active { color: var(--star-color); }
        
        .tts-btn { position: absolute; top: 20px; left: 20px; font-size: 1.6rem; z-index: 100; padding: 10px; cursor: pointer; transition: transform 0.1s; }
        .tts-btn:active { transform: scale(0.9); }
        .card-front .tts-btn { color: var(--primary); }
        .card-back .tts-btn { color: white; opacity: 0.9; }

        .swipe-hint { position: absolute; bottom: 100px; display: flex; gap: 30px; z-index: 10; pointer-events: none; }
        .hint-pill { display: flex; align-items: center; gap: 6px; background: white; border-radius: 20px; padding: 6px 14px; font-size: 0.8rem; font-weight: 700; color: #94a3b8; box-shadow: 0 2px 8px rgba(0,0,0,0.08); transition: background-color 0.3s; }
        .hint-pill.ok { color: #8BC34A; }
        .hint-pill.no { color: #EF5350; }

        .nav-bar { position: absolute; bottom: 30px; width: 100%; max-width: 400px; display: flex; justify-content: space-between; padding: 0 30px; }
        .nav-btn { background: white; border: 2px solid #e2e8f0; color: #64748b; padding: 12px 20px; border-radius: 30px; font-weight: 800; font-size: 0.9rem; box-shadow: 0 4px 6px rgba(0,0,0,0.05); cursor: pointer; transition: transform 0.1s, background-color 0.3s; }
        .nav-btn.ok { border-color: #8BC34A; color: #8BC34A; }
        .nav-btn.no { border-color: #EF5350; color: #EF5350; }
        .nav-btn:active { transform: scale(0.95); }
        .nav-btn.ok:active { background: #8BC34A; color: white; }
        .nav-btn.no:active { background: #EF5350; color: white; }
    </style>
</head>
<body>

    <div id="intro-screen">
        <div style="font-size: 4rem; margin-bottom: 10px;">📘</div>
        <div style="font-size: 2rem; font-weight: 900;">TOEIC MASTER</div>
    </div>

    <!-- 1. 메인 화면 (단어장 관리) -->
    <div id="home-page" class="page active">
        <div class="header">
            <span style="color:var(--primary)">내 단어장 목록</span>
            <div style="display: flex; align-items: center; gap: 8px;">
                <!-- 파이어베이스 인증 버튼 -->
                <button id="auth-btn" onclick="toggleAuth()" style="background:#10B981; color:white; border:none; border-radius:8px; padding:6px 10px; font-weight:bold; cursor:pointer; font-size:0.8rem; display:flex; align-items:center; gap:4px;">
                    👤 로그인
                </button>
                <button class="accent-btn" onclick="toggleAccent()" style="background:none; border:none; font-size:1.3rem; padding:0; cursor:pointer;" title="발음 선택">🇺🇸</button>
                <button class="dark-mode-btn" onclick="toggleDarkMode()" style="background:none; border:none; font-size:1.3rem; padding:0; cursor:pointer;" title="다크 모드">🌙</button>
                <button onclick="toggleFullScreen()" style="background:none; border:none; font-size:1.3rem; padding:0; cursor:pointer;" title="전체화면">⛶</button>
            </div>
        </div>
        <div class="content-area">
            
            <div class="tool-btn-group" style="margin-bottom: 20px;">
                <button class="tool-btn highlight" onclick="createNewDeck()">➕ 새 단어장</button>
                <button class="tool-btn highlight" onclick="document.getElementById('excel-upload').click()" style="background:#E0F2FE; border-color:#BAE6FD; color:#0284C7;">📊 엑셀 파일 추가</button>
                <input type="file" id="excel-upload" accept=".xls,.xlsx,.csv" style="display: none;" onchange="importExcel(event)">

                <button class="tool-btn" onclick="document.getElementById('import-deck-upload').click()">📂 백업 불러오기</button>
                <button class="tool-btn highlight" onclick="exportAllDecks()" style="background:#FFFBEB; border-color:#FDE68A; color:#D97706;">📦 통합 백업 다운</button>
                <input type="file" id="import-deck-upload" accept=".json" style="display: none;" onchange="importDeck(event)">
            </div>

            <!-- 글로벌 다중 묶음 학습 UI -->
            <div class="session-config" id="global-session-config" style="margin-bottom: 20px;">
                <h3 style="margin: 0 0 10px 0; color: var(--primary); font-size: 1.1rem; display: flex; justify-content: center; align-items: center; gap: 6px;">
                    <span>🌟</span> 다중 단어장 묶음 학습
                </h3>
                
                <div style="margin-bottom: 15px; text-align: left; background:#f8fafc; padding:12px; border-radius:10px; border:1px solid #e2e8f0;">
                    <span style="font-weight: 700; color:#475569; font-size: 0.85rem; display: block; margin-bottom: 8px;">📚 대상 단어장 다중 선택:</span>
                    <div id="global-deck-checkboxes" style="display: flex; flex-direction: column; gap: 6px; max-height: 150px; overflow-y: auto; padding: 2px;">
                    </div>
                </div>

                <div style="font-weight:700; color:#334155; font-size:1rem; margin-bottom:10px; text-align:center;">
                    🎯 학습 목표: <span id="global-val-display" style="color:var(--primary)">전체</span>
                </div>
                <input type="range" id="global-count-slider" min="0" max="100" step="1" oninput="updateGlobalSliderUI()">
                
                <div class="order-toggle" style="margin: 15px 0 10px 0; display: flex; justify-content: center; gap: 20px; font-weight: 700; color: #334155; font-size: 0.95rem;">
                    <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
                        <input type="radio" name="global-order" value="seq" checked style="accent-color: var(--primary); width:18px; height:18px;">
                        ⬇️ 순서대로
                    </label>
                    <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
                        <input type="radio" name="global-order" value="rand" style="accent-color: var(--primary); width:18px; height:18px;">
                        🎲 랜덤으로
                    </label>
                </div>

                <div class="learning-mode-btns">
                    <button class="modal-action-btn secondary" style="margin-bottom:0; padding: 12px 2px; font-size:0.9rem;" onclick="startStudy('en', true)">영어로 학습</button>
                    <button class="modal-action-btn secondary" style="margin-bottom:0; padding: 12px 2px; font-size:0.9rem;" onclick="startStudy('kr', true)">한국어로 학습</button>
                    <button class="modal-action-btn" style="margin-bottom:0; padding: 12px 2px; font-size:0.9rem; background:#E0F2FE; color:#0284C7; border: 1px solid #BAE6FD;" onclick="unlockAudio(); startStudy('listen', true)">소리로 학습 🎧</button>
                    <button class="modal-action-btn" style="margin-bottom:0; padding: 12px 2px; font-size:0.9rem; background:#10B981; color:white; border:none;" onclick="unlockAudio(); startStudy('auto', true)">자동 재생 학습 🚀</button>
                </div>
                
                <button class="tool-btn highlight" style="width: 100%; margin-top: 10px; border-color: #FDE68A; background: #FFFBEB; color: #D97706;" onclick="startFavorites(true)">⭐ 선택한 단어장 즐겨찾기만 복습</button>
                <button id="btn-global-continue" class="tool-btn full-width continue" onclick="resumeGlobalSession()" style="margin-top: 15px; display:none;">▶ 통합 이어서 학습하기 (0개 남음)</button>
            </div>

            <div class="deck-list" id="deck-list-container"></div>
        </div>
    </div>

    <!-- 2. 단어장 내부(로비) -->
    <div id="lobby-page" class="page">
        <div class="header">
            <button onclick="goHome()" style="background:none; border:none; font-size:1.2rem; color:#64748B; padding:0; cursor:pointer; font-weight:bold;">← 뒤로</button>
            <span id="current-deck-title" style="color:var(--primary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:40%;">단어장</span>
            <div style="display: flex; align-items: center; gap: 8px;">
                <button class="accent-btn" onclick="toggleAccent()" style="background:none; border:none; font-size:1.3rem; padding:0; cursor:pointer;" title="발음 선택">🇺🇸</button>
                <button class="dark-mode-btn" onclick="toggleDarkMode()" style="background:none; border:none; font-size:1.3rem; padding:0; cursor:pointer;" title="다크 모드">🌙</button>
                <button onclick="toggleFullScreen()" style="background:none; border:none; font-size:1.3rem; padding:0; cursor:pointer;" title="전체화면">⛶</button>
                <span id="total-stars" style="color:var(--star-color); background:#FFFBEB; padding:4px 10px; border-radius:20px; font-size:0.9rem;">⭐ 0</span>
            </div>
        </div>
        <div class="content-area">
            
            <button id="btn-continue" class="tool-btn full-width continue" onclick="resumeSession()">▶ 이어서 학습하기 (0개 남음)</button>

            <div class="session-config">
                <h3 style="margin: 0 0 10px 0; color: var(--primary); font-size: 1.1rem; display: flex; justify-content: center; align-items: center; gap: 6px;">
                    <span>🎯</span> 단어장 내 학습 설정
                </h3>
                
                <div style="margin-bottom: 15px; text-align: left; background:#f8fafc; padding:12px; border-radius:10px; border:1px solid #e2e8f0;">
                    <span style="font-weight: 700; color:#475569; font-size: 0.85rem; display: block; margin-bottom: 8px;">📚 대상 시트(Day) 선택:</span>
                    <div id="lobby-category-checkboxes" style="display: flex; flex-direction: column; gap: 6px; max-height: 200px; overflow-y: auto; padding: 2px;">
                    </div>
                </div>

                <div style="font-weight:700; color:#334155; font-size:1.1rem; margin-bottom: 10px;">
                    🎯 선택된 단어 수: <span id="val-display" style="color:var(--primary)">전체</span>
                </div>
                <input type="range" id="count-slider" min="0" max="100" step="1" oninput="updateSliderUI()">
                
                <div class="order-toggle" style="margin: 15px 0 10px 0; display: flex; justify-content: center; gap: 20px; font-weight: 700; color: #334155; font-size: 0.95rem;">
                    <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
                        <input type="radio" name="lobby-order" value="seq" checked style="accent-color: var(--primary); width:18px; height:18px;">
                        ⬇️ 순서대로
                    </label>
                    <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
                        <input type="radio" name="lobby-order" value="rand" style="accent-color: var(--primary); width:18px; height:18px;">
                        🎲 랜덤으로
                    </label>
                </div>

                <div class="learning-mode-btns">
                    <button class="modal-action-btn secondary" style="margin-bottom:0; padding: 12px 2px; font-size:0.9rem;" onclick="startStudy('en', false)">영어로 학습</button>
                    <button class="modal-action-btn secondary" style="margin-bottom:0; padding: 12px 2px; font-size:0.9rem;" onclick="startStudy('kr', false)">한국어로 학습</button>

                    </div>
                    <!-- 카드 뒷면 -->
                    <div class="card-face card-back">
                        <div class="tts-btn" onclick="playTTS(event)" title="영어 발음 듣기">🔊</div>
                        <div class="star-toggle" id="starBack" onclick="toggleStar(event)">☆</div>
                        <div class="meaning" id="krMeaning">의미</div>
                    </div>

            <div class="swipe-hint">
                <div class="hint-pill no">← 다시 학습</div>
                <div class="hint-pill ok">외웠음 →</div>

            <div class="nav-bar">
                <button class="nav-btn no" onclick="markNo()">✕ 다시</button>
                <button class="nav-btn ok" onclick="markOk()">○ 외움</button>

    <!-- 모달들 -->
    <div id="complete-modal" class="overlay-modal">
        <div class="modal-card">
            <div class="emoji">🎉</div>
            <h2>학습 완료!</h2>

        </div>

    <div id="pause-modal" class="overlay-modal">
        <div class="modal-card">
            <div class="emoji">⏸</div>
            <h2>일시정지</h2>
            <p id="pause-msg">현재 진행 상태가 자동으로 저장됩니다.</p>
            <button class="modal-action-btn primary" onclick="closePauseModal()">▶ 계속 학습하기</button>
            <button class="modal-action-btn secondary" onclick="goBackToLobby()">🏠 메뉴로 나가기</button>
        </div>

    <script>
        // --- ⚙️ 설정 & 테마 (다크모드 & 발음) ---
        let currentAccent = localStorage.getItem('jpMasterAccent') || 'en-US';
        let isDarkMode = localStorage.getItem('jpMasterDarkMode') === 'true';

        function applySettings() {
            if(isDarkMode) {
                document.body.classList.add('dark-mode');
                document.querySelectorAll('.dark-mode-btn').forEach(btn => btn.innerText = '☀️');
            } else {
                document.body.classList.remove('dark-mode');
                document.querySelectorAll('.dark-mode-btn').forEach(btn => btn.innerText = '🌙');
            }
            document.querySelectorAll('.accent-btn').forEach(btn => btn.innerText = currentAccent === 'en-US' ? '🇺🇸' : '🇬🇧');
        }

        function toggleDarkMode() {
            isDarkMode = !isDarkMode;
            if(isDarkMode) document.body.classList.add('dark-mode');
            else document.body.classList.remove('dark-mode');
            document.querySelectorAll('.dark-mode-btn').forEach(btn => btn.innerText = isDarkMode ? '☀️' : '🌙');
            localStorage.setItem('jpMasterDarkMode', isDarkMode);
        }

        function toggleAccent() {
            currentAccent = currentAccent === 'en-US' ? 'en-GB' : 'en-US';
            document.querySelectorAll('.accent-btn').forEach(btn => btn.innerText = currentAccent === 'en-US' ? '🇺🇸' : '🇬🇧');
            localStorage.setItem('jpMasterAccent', currentAccent);
        }

        // --- 🔥 Firebase 설정 및 초기화 ---
        const firebaseConfig = {
            apiKey: "AIzaSyA5jIVHnTYLzHCCvdgmgV46E4zXSW-Ex8U",
            authDomain: "toeic-69cef.firebaseapp.com",
            projectId: "toeic-69cef",
            storageBucket: "toeic-69cef.firebasestorage.app",
            messagingSenderId: "909605072270",
            appId: "1:909605072270:web:ebf45619399a42e5b108df"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let appData = []; 
        let currentDeckIndex = -1;
        let isGlobalMode = false;

        // 로그인 / 로그아웃 토글
        function toggleAuth() {
            if (currentUser) {
                if (confirm("로그아웃 하시겠습니까?\n로그아웃하면 로컬 오프라인 데이터 모드로 전환됩니다.")) {
                    auth.signOut();
                }
            } else {
                const provider = new firebase.auth.GoogleAuthProvider();
                auth.signInWithPopup(provider).catch(error => {
                    console.error("로그인 에러:", error);
                    alert("로그인 중 오류가 발생했습니다: " + error.message);
                });
            }
        }

        // 인증 상태 감지기
        auth.onAuthStateChanged(user => {
            const authBtn = document.getElementById('auth-btn');
            if (user) {
                currentUser = user;
                const name = user.displayName ? user.displayName.split(' ')[0] : '회원';
                authBtn.innerHTML = `👋 ${name} (로그아웃)`;
                authBtn.style.background = "#DC2626";
                loadDataFromFirebase();
            } else {
                currentUser = null;
                authBtn.innerHTML = `👤 로그인`;
                authBtn.style.background = "#10B981";
                loadLocalData();
            }
        });

        // --- 💾 데이터베이스 및 로컬 동기화 ---
        function loadLocalData() {
            let saved = localStorage.getItem('jpMasterAppData');
            if (saved) appData = JSON.parse(saved);
            else appData = [];
            renderHomeUI();
            applySettings();
        }

        async function loadDataFromFirebase() {
            try {
                const docRef = db.collection("users").doc(currentUser.uid);
                const docSnap = await docRef.get();
                if (docSnap.exists) {
                    appData = docSnap.data().appData || [];
                    localStorage.setItem('jpMasterAppData', JSON.stringify(appData));
                } else {
                    let saved = localStorage.getItem('jpMasterAppData');
                    if (saved && JSON.parse(saved).length > 0) {
                        appData = JSON.parse(saved);
                        saveAppData();
                        alert("기존 단어장이 클라우드 계정에 자동 백업되었습니다! ☁️");
                    } else {
                        appData = [];
                    }
                }
                renderHomeUI();
                applySettings();
            } catch (error) {
                console.error("클라우드 데이터 로드 오류:", error);
                loadLocalData();
            }
        }

        function saveAppData() { 
            localStorage.setItem('jpMasterAppData', JSON.stringify(appData)); 
            if (currentUser) {
                db.collection("users").doc(currentUser.uid).set({
                    appData: appData,
                    lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                }).catch(error => {
                    console.error("클라우드 저장 실패:", error);
                });
            }
        }

        function getDeck() { return appData[currentDeckIndex]; }
        function getDeckByCardId(cardId) {
            for (let i = 0; i < appData.length; i++) { 
                if (appData[i].words && appData[i].words.find(w => w.id === cardId)) return appData[i]; 
            }
            return null;
        }

        setTimeout(() => document.getElementById('intro-screen').classList.add('hidden'), 1000);
        window.onload = function() { applySettings(); };

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        // --- 📊 엑셀 파일 업로드 & 파일 단위 단일 단어장 생성 ---
        function importExcel(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            let deckName = file.name.replace(/\.[^/.]+$/, "");
            if (!deckName) deckName = "새 엑셀 단어장";

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const isKorean = (str) => /[ㄱ-ㅎ|ㅏ-ㅣ|가-힣]/.test(str);
                
                let allWords = [];
                let importedSheetCount = 0;

                workbook.SheetNames.forEach(sheetName => {
                    if (sheetName.toLowerCase().includes('test')) return;

                    const sheet = workbook.Sheets[sheetName];
                    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });

                    let sheetWordsCount = 0;
                    rows.forEach(row => {
                        if (!row || !Array.isArray(row)) return;
                        for (let i = 0; i < row.length - 1; i++) {
                            let cell1 = row[i] ? String(row[i]).trim() : '';
                            let cell2 = row[i+1] ? String(row[i+1]).trim() : '';

                            if (cell1 && cell2) {
                                if (isNaN(cell1) && !isKorean(cell1) && isKorean(cell2)) {
                                    allWords.push({
                                        id: 'w_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                                        jp: cell1,
                                        kr: cell2,
                                        category: sheetName
                                    });
                                    sheetWordsCount++;
                                    i++; 
                                }
                            }
                        }
                    });
                    if (sheetWordsCount > 0) importedSheetCount++;
                });

                if (allWords.length > 0) {
                    let newDeck = { id: 'deck_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5), name: deckName, words: allWords, stars: [], session: null, trash: [] };
                    appData.unshift(newDeck); 
                    saveAppData(); 
                    renderHomeUI();
                    alert(`"${deckName}" 단어장에 ${importedSheetCount}개의 시트(Day)가 통합 생성되었습니다!\n(Test 시트는 자동으로 제외됨)`);
                } else { 
                    alert("추출할 영어 단어가 없거나 엑셀 구조를 인식할 수 없습니다."); 
                }
            }; 
            reader.readAsArrayBuffer(file); 
            event.target.value = ''; 
        }

        // --- 글로벌 다중 단어장 선택 로직 (메인 홈) ---
        function getGlobalSelectedWords() {
            const checkedBoxes = document.querySelectorAll('input[name="selected-global-decks"]:checked');
            const selectedIds = Array.from(checkedBoxes).map(cb => cb.value);
            let selectedWords = [];
            appData.forEach(deck => { if (selectedIds.includes(deck.id) && deck.words) selectedWords = selectedWords.concat(deck.words); });
            return selectedWords;
        }

        function updateGlobalSliderUI() {
            const slider = document.getElementById('global-count-slider');
            const display = document.getElementById('global-val-display');
            const selectedWordsLength = getGlobalSelectedWords().length;
            
            if (slider) {
                slider.max = selectedWordsLength > 0 ? selectedWordsLength : 1;
                if (selectedWordsLength === 0) { display.innerText = "단어 없음"; slider.value = 0; } 
                else if (parseInt(slider.value) >= selectedWordsLength || parseInt(slider.value) === 0) { slider.value = selectedWordsLength; display.innerText = `전체 (${selectedWordsLength}개)`; } 
                else { display.innerText = `${slider.value}개`; }
            }
        }

        function renderGlobalDeckSelection() {
            const container = document.getElementById('global-deck-checkboxes'); if (!container) return;
            const previouslyChecked = {};
            container.querySelectorAll('input[type="checkbox"]').forEach(cb => { previouslyChecked[cb.value] = cb.checked; });

            container.innerHTML = '';
            if (appData.length === 0) { container.innerHTML = '<span style="font-size:0.85rem; color:#94a3b8; padding:5px 0;">단어장이 없습니다. 엑셀을 추가해보세요.</span>'; return; }

            appData.forEach(deck => {
                const isChecked = previouslyChecked[deck.id] !== undefined ? previouslyChecked[deck.id] : true;
                const label = document.createElement('label');
                label.style.display = 'flex'; label.style.alignItems = 'center'; label.style.gap = '8px'; label.style.fontSize = '0.9rem'; label.style.cursor = 'pointer'; label.style.fontWeight = '700'; label.style.padding = '5px 0';
                label.innerHTML = `
                    <input type="checkbox" name="selected-global-decks" value="${deck.id}" ${isChecked ? 'checked' : ''} onchange="updateGlobalSliderUI()" style="accent-color:var(--primary); width:18px; height:18px;">
                    <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%;">📚 ${deck.name} (${deck.words ? deck.words.length : 0}개)</span>
                `;
                container.appendChild(label);
            });
        }

        function renderHomeUI() {
            const container = document.getElementById('deck-list-container'); container.innerHTML = '';
            renderGlobalDeckSelection(); updateGlobalSliderUI();

            let globalSessionStr = localStorage.getItem('jpMasterGlobalSession');
            let globalSession = globalSessionStr ? JSON.parse(globalSessionStr) : null;
            let btnGlobalContinue = document.getElementById('btn-global-continue');
            if (btnGlobalContinue) {
                if (globalSession && globalSession.queue && globalSession.queue.length > 0) { btnGlobalContinue.style.display = 'block'; btnGlobalContinue.innerText = `▶ 통합 이어서 학습하기 (${globalSession.queue.length}개 남음)`; } 
                else { btnGlobalContinue.style.display = 'none'; }
            }

            if (appData.length === 0) { container.innerHTML = '<div style="text-align:center; padding: 40px 20px; color:#94a3b8;">생성된 단어장이 없습니다.<br>엑셀 파일 추가 버튼을 눌러보세요!</div>'; return; }

            appData.forEach((deck, index) => {
                const wCount = deck.words ? deck.words.length : 0; const sCount = deck.stars ? deck.stars.length : 0;
                const card = document.createElement('div'); card.className = 'deck-card';
                card.innerHTML = `
                    <div class="deck-card-header">
                        <div>
                            <h3 class="deck-title" onclick="renameDeck(${index})" style="cursor:pointer;" title="이름 변경">📚 ${deck.name} <span style="font-size:0.8rem; color:#94a3b8;">✏️</span></h3>
                            <p class="deck-info">단어 ${wCount}개 · ⭐ ${sCount}개</p>
                        </div>
                    </div>
                    <div class="deck-actions">
                        <button class="btn-open" onclick="openDeck(${index})">입장하기</button>
                        <button class="btn-icon" onclick="moveDeck(${index}, -1)" ${index === 0 ? 'disabled' : ''} title="위로 이동">🔼</button>
                        <button class="btn-icon" onclick="moveDeck(${index}, 1)" ${index === appData.length - 1 ? 'disabled' : ''} title="아래로 이동">🔽</button>
                        <button class="btn-icon" onclick="exportDeck(${index})" title="현재 단일 단어장 백업">💾</button>
                        <button class="btn-icon danger" onclick="deleteDeck(${index})" title="삭제">🗑</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // --- 로비(단어장 내부) Day 다중 선택 기능 ---
        function getLobbySelectedWords() {
            const deck = getDeck(); if (!deck) return [];
            const checkboxes = document.querySelectorAll('input[name="selected-categories"]:checked');
            if (checkboxes.length === 0) return []; 
            const selectedCats = Array.from(checkboxes).map(cb => cb.value);
            return deck.words.filter(w => selectedCats.includes(w.category || "uncategorized"));
        }

        function renderLobbyCategorySelection() {
            const container = document.getElementById('lobby-category-checkboxes'); if (!container) return;
            const deck = getDeck(); if (!deck) return;

            const categoryCounts = {}; let noCategoryCount = 0;
            deck.words.forEach(w => { if (w.category) categoryCounts[w.category] = (categoryCounts[w.category] || 0) + 1; else noCategoryCount++; });

            container.innerHTML = '';
            if (Object.keys(categoryCounts).length === 0 && noCategoryCount === 0) { container.innerHTML = '<span style="font-size:0.85rem; color:#94a3b8; padding:5px 0;">단어가 없습니다.</span>'; return; }

            if (Object.keys(categoryCounts).length > 0) {
                const selectAllLabel = document.createElement('label');
                selectAllLabel.style = "display:flex; align-items:center; gap:8px; font-size:0.9rem; cursor:pointer; font-weight:800; padding:5px 0; border-bottom:1px solid #e2e8f0; margin-bottom:4px;";
                selectAllLabel.innerHTML = `<input type="checkbox" id="lobby-select-all" checked onchange="toggleLobbyAllCategories(this)" style="accent-color:var(--primary); width:18px; height:18px;"> 전체 시트(Day) 선택`;
                container.appendChild(selectAllLabel);

                for (const cat in categoryCounts) {
                    const label = document.createElement('label'); label.style = "display:flex; align-items:center; gap:8px; font-size:0.9rem; cursor:pointer; font-weight:700; padding:5px 0;";
                    label.innerHTML = `<input type="checkbox" name="selected-categories" value="${cat}" checked onchange="updateLobbyCheckAllState(); updateSliderUI();" style="accent-color:var(--primary); width:18px; height:18px;"> <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">📄 ${cat} (${categoryCounts[cat]}개)</span>`;
                    container.appendChild(label);
                }
            }
            if (noCategoryCount > 0) {
                const label = document.createElement('label'); label.style = "display:flex; align-items:center; gap:8px; font-size:0.9rem; cursor:pointer; font-weight:700; padding:5px 0;";
                label.innerHTML = `<input type="checkbox" name="selected-categories" value="uncategorized" checked onchange="updateLobbyCheckAllState(); updateSliderUI();" style="accent-color:var(--primary); width:18px; height:18px;"> <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">📄 기본 단어 (${noCategoryCount}개)</span>`;
                container.appendChild(label);
            }
        }

        function toggleLobbyAllCategories(source) { document.querySelectorAll('input[name="selected-categories"]').forEach(cb => cb.checked = source.checked); updateSliderUI(); }
        function updateLobbyCheckAllState() {
            const selectAllCb = document.getElementById('lobby-select-all'); if (!selectAllCb) return;
            let allChecked = true; document.querySelectorAll('input[name="selected-categories"]').forEach(cb => { if (!cb.checked) allChecked = false; }); selectAllCb.checked = allChecked;
        }

        function updateSliderUI() {
            const slider = document.getElementById('count-slider'); const display = document.getElementById('val-display');
            let wordsToStudy = document.querySelectorAll('input[name="selected-categories"]').length > 0 ? getLobbySelectedWords() : (getDeck() ? getDeck().words : []);
            const maxCount = wordsToStudy.length;
            
            if(maxCount === 0) { display.innerText = "단어 없음"; slider.value = 0; slider.max = 1; } 
            else {
                slider.max = maxCount;
                if(parseInt(slider.value) >= maxCount || parseInt(slider.value) === 0) { slider.value = maxCount; display.innerText = `전체 (${maxCount}개)`; } 
                else display.innerText = `${slider.value}개`;
            }
        }

        function updateLobbyUI() {
            if (currentDeckIndex === -1) return;
            const deck = getDeck();
            document.getElementById('current-deck-title').innerText = deck.name;
            document.getElementById('total-stars').innerText = `⭐ ${deck.stars ? deck.stars.length : 0}`;
            renderLobbyCategorySelection(); updateSliderUI();

            const btnContinue = document.getElementById('btn-continue');
            if (deck.session && deck.session.queue && deck.session.queue.length > 0) {
                btnContinue.style.display = 'block'; btnContinue.innerText = `▶ 이어서 학습하기 (${deck.session.queue.length}개 남음)`;
            } else { btnContinue.style.display = 'none'; }
        }

        function openDeck(index) { isGlobalMode = false; currentDeckIndex = index; updateLobbyUI(); showPage('lobby-page'); }
        function goHome() { currentDeckIndex = -1; renderHomeUI(); showPage('home-page'); }
        function createNewDeck() { let name = prompt("새 단어장의 이름을 입력하세요:", "새 단어장"); if (name && name.trim() !== "") { appData.unshift({ id: 'deck_' + Date.now(), name: name.trim(), words: [], stars: [], session: null, trash: [] }); saveAppData(); renderHomeUI(); } }
        function renameDeck(index) { let name = prompt("단어장의 새 이름을 입력하세요:", appData[index].name); if (name && name.trim() !== "" && name !== appData[index].name) { appData[index].name = name.trim(); saveAppData(); renderHomeUI(); } }
        function deleteDeck(index) { if (confirm(`'${appData[index].name}' 단어장을 정말 삭제하시겠습니까?\n이 단어장 데이터는 영구 삭제됩니다.`)) { appData.splice(index, 1); saveAppData(); renderHomeUI(); } }
        function moveDeck(index, dir) { if (index + dir < 0 || index + dir >= appData.length) return; const temp = appData[index]; appData[index] = appData[index + dir]; appData[index + dir] = temp; saveAppData(); renderHomeUI(); }
        
        function exportDeck(index) { const deck = appData[index]; const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(deck, null, 2)], { type: 'application/json' })); a.download = `TOEIC_Single_${deck.name}_${new Date().toISOString().slice(0,10)}.json`; a.click(); }
        function exportAllDecks() { if (appData.length === 0) { alert("백업할 단어장이 없습니다."); return; } const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' })); a.download = `TOEIC_AllDecks_${new Date().toISOString().slice(0,10)}.json`; a.click(); }
        function importDeck(event) {
            const file = event.target.files[0]; if (!file) return; const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (Array.isArray(data)) { data.forEach(d => addImportedDeck(d, d.name || '불러온 단어장')); alert(`${data.length}개의 단어장을 성공적으로 불러왔습니다!`); } 
                    else { addImportedDeck(data, data.name ? data.name : (file.name.replace('.json', '') || '불러온 단어장')); alert("단어장을 성공적으로 불러왔습니다!"); }
                    saveAppData(); renderHomeUI();
                } catch (err) { alert("파일 형식을 확인해주세요."); }
            }; reader.readAsText(file); event.target.value = ''; 
        }
        function addImportedDeck(data, defaultName) {
            let newDeck = { id: 'deck_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5), name: defaultName, words: Array.isArray(data.words) ? data.words : [], stars: Array.isArray(data.stars) ? data.stars : [], session: null, trash: Array.isArray(data.trash) ? data.trash : [] };
            const idMap = {};
            newDeck.words = newDeck.words.map((w, idx) => { const newId = 'w_' + Date.now() + '_' + idx + '_' + Math.random().toString(36).substr(2, 5); idMap[w.id] = newId; return { jp: w.jp, kr: w.kr, id: newId, category: w.category || "기본 단어" }; });
            newDeck.stars = newDeck.stars.map(oldId => idMap[oldId]).filter(Boolean); appData.push(newDeck);
        }

        // --- 학습 제어 코어 ---
        let activeQueue = [];
        let totalCount = 0;
        let isFlipped = false;
        let isFavMode = false;
        let isKrFirst = false; 
        let isListenMode = false;
        let isAutoMode = false;

        function saveSessionState() {
            const state = { queue: activeQueue, total: totalCount, isFav: isFavMode, isKrFirst: isKrFirst, isListenMode: isListenMode, isAutoMode: isAutoMode };
            if (isGlobalMode) { localStorage.setItem('jpMasterGlobalSession', JSON.stringify(state)); renderHomeUI(); } 
            else { if(getDeck()) getDeck().session = state; saveAppData(); updateLobbyUI(); }
        }
        function clearSessionState() { 
            if (isGlobalMode) { localStorage.removeItem('jpMasterGlobalSession'); renderHomeUI(); } 
            else { if(getDeck()) getDeck().session = null; saveAppData(); updateLobbyUI(); } 
        }
        
        function unlockAudio() {
            if (!('speechSynthesis' in window)) return;
            const u = new SpeechSynthesisUtterance('');
            window.speechSynthesis.speak(u);
        }

        function startStudy(mode, isGlobal) {
            let targetWords = []; let count = 0; let isRandom = false;

            if (isGlobal) {
                targetWords = getGlobalSelectedWords(); if (targetWords.length === 0) { alert("선택된 단어장이 없습니다."); return; }
                count = parseInt(document.getElementById('global-count-slider').value) || targetWords.length;
                isRandom = document.querySelector('input[name="global-order"]:checked').value === 'rand';
            } else {
                targetWords = getLobbySelectedWords(); if (targetWords.length === 0) { alert("선택된 시트(단어)가 없습니다."); return; }
                count = parseInt(document.getElementById('count-slider').value) || targetWords.length;
                isRandom = document.querySelector('input[name="lobby-order"]:checked').value === 'rand';
            }

            isGlobalMode = isGlobal; 
            isFavMode = false; 
            
            let shuffled = isRandom ? [...targetWords].sort(() => Math.random() - 0.5) : [...targetWords];
            activeQueue = shuffled.slice(0, count); totalCount = activeQueue.length;
            if (totalCount === 0) return;

            isKrFirst = false; isListenMode = false; isAutoMode = false; let modeText = "";
            
            if (mode === 'en') { isKrFirst = false; modeText = "영어로 학습"; } 
            else if (mode === 'kr') { isKrFirst = true; modeText = "한국어로 학습"; } 
            else if (mode === 'listen') { isListenMode = true; modeText = "소리로 학습 🎧"; } 
            else if (mode === 'auto') { isAutoMode = true; modeText = "자동 재생 학습 🚀"; }

            document.getElementById('stage-info').innerText = `${isGlobal ? '통합 ' : ''}${modeText} (${totalCount}개)`;
            saveSessionState(); initGame();
        }

        function startFavorites(isGlobal) {
            let targetWords = [];
            if (isGlobal) {
                const selectedIds = Array.from(document.querySelectorAll('input[name="selected-global-decks"]:checked')).map(cb => cb.value);
                appData.forEach(deck => { if (selectedIds.includes(deck.id) && deck.words && deck.stars) targetWords = targetWords.concat(deck.words.filter(w => deck.stars.includes(w.id))); });
            } else {
                const deck = getDeck(); if (!deck || !deck.stars || deck.stars.length === 0) { alert("단어장에 즐겨찾기한 단어가 없습니다."); return; }
                targetWords = getLobbySelectedWords().filter(w => deck.stars.includes(w.id));
            }

            if (targetWords.length === 0) { alert("선택된 영역 내에 즐겨찾기한 단어가 없습니다."); return; }
            
            isGlobalMode = isGlobal; 
            isFavMode = true; 
            isKrFirst = false; isListenMode = false; isAutoMode = false;

            let isRandom = isGlobal 
                ? document.querySelector('input[name="global-order"]:checked').value === 'rand'
                : document.querySelector('input[name="lobby-order"]:checked').value === 'rand';

            activeQueue = isRandom ? targetWords.sort(() => Math.random() - 0.5) : [...targetWords];
            totalCount = activeQueue.length;
            document.getElementById('stage-info').innerText = isGlobal ? "⭐ 통합 복습 모드" : "⭐ 복습 모드";
            saveSessionState(); initGame();
        }

        function restoreSessionFields(session) {
            activeQueue = session.queue; totalCount = session.total; isFavMode = session.isFav; 
            isKrFirst = session.isKrFirst || false; isListenMode = session.isListenMode || false; isAutoMode = session.isAutoMode || false;
            if(isAutoMode || isListenMode) unlockAudio();
        }
        function resumeSession() {
            const session = getDeck() ? getDeck().session : null; if (!session || !session.queue || session.queue.length === 0) return;
            isGlobalMode = false; restoreSessionFields(session);
            document.getElementById('stage-info').innerText = isAutoMode ? "🚀 자동 재생 이어하기" : (isListenMode ? "🎧 듣기 학습 이어하기" : (isFavMode ? "⭐ 복습 이어하기" : "학습 이어하기")); initGame();
        }
        function resumeGlobalSession() {
            let sessionStr = localStorage.getItem('jpMasterGlobalSession'); if (!sessionStr) return;
            const session = JSON.parse(sessionStr); if (!session || !session.queue || session.queue.length === 0) return;
            isGlobalMode = true; restoreSessionFields(session);
            document.getElementById('stage-info').innerText = isAutoMode ? "🚀 통합 자동 재생 이어하기" : (isListenMode ? "통합 듣기 학습 이어하기" : "통합 학습 이어하기"); initGame();
        }

        // --- 학습 시 UI 업데이트 & TTS 기능 ---
        let autoPlayTimer1 = null; let autoPlayTimer2 = null; let autoPlayFallback = null;

        function clearAutoPlay() { clearTimeout(autoPlayTimer1); clearTimeout(autoPlayTimer2); clearTimeout(autoPlayFallback); window.speechSynthesis.cancel(); }

        function speakCurrentWord() {
            if (activeQueue.length === 0 || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(activeQueue[0].jp);
            utterance.lang = currentAccent;
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        function autoPlaySequence(card) {
            clearAutoPlay();
            if (!('speechSynthesis' in window)) { setTimeout(() => { markOk(); }, 2000); return; }
            
            const utterance = new SpeechSynthesisUtterance(card.jp);
            utterance.lang = currentAccent; utterance.rate = 1.0;
            
            const proceedToFlip = () => {
                clearTimeout(autoPlayFallback);
                autoPlayTimer1 = setTimeout(() => {
                    isFlipped = true;
                    const ci = document.getElementById('cardInner');
                    ci.style.transition = 'transform 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
                    ci.classList.add('flipped');
                    
                    autoPlayTimer2 = setTimeout(() => { markOk(); }, 1200);
                }, 400);
            };

            utterance.onend = proceedToFlip; utterance.onerror = proceedToFlip;
            autoPlayFallback = setTimeout(proceedToFlip, 4000); 

            window.speechSynthesis.speak(utterance);
        }

        function playTTS(e) { if (e) e.stopPropagation(); if (!('speechSynthesis' in window)) { alert("현재 브라우저는 음성 읽기 기능을 지원하지 않습니다."); return; } speakCurrentWord(); }

        function adjustFontSize(element, text, isFront) {
            const len = text.length;
            if (isFront) { if (len >= 15) element.style.fontSize = "1.4rem"; else if (len > 8) element.style.fontSize = "1.9rem"; else element.style.fontSize = "2.5rem"; } 
            else { if (len >= 15) element.style.fontSize = "1.2rem"; else if (len > 8) element.style.fontSize = "1.5rem"; else element.style.fontSize = "1.8rem"; }
        }

        function initGame() { updateCard(); updateProgress(); showPage('game-page'); }
        function updateProgress() { document.getElementById('progressFill').style.width = (totalCount > 0 ? ((totalCount - activeQueue.length) / totalCount) * 100 : 0) + '%'; document.getElementById('queue-count').innerText = `${activeQueue.length} left`; }
        
        function updateCard() {
            clearAutoPlay();
            if (activeQueue.length === 0) { clearSessionState(); showComplete(); return; }
            const card = activeQueue[0]; const deck = isGlobalMode ? getDeckByCardId(card.id) : getDeck();
            if (!deck) { activeQueue.shift(); totalCount--; updateCard(); return; }
            
            const frontEl = document.getElementById('jpWord'); const backEl = document.getElementById('krMeaning');
            
            if (isListenMode) {
                frontEl.innerHTML = `<div style="font-size:4rem; margin-bottom:12px;">🎧</div><div style="font-size:1.1rem; color:#64748b; font-weight:700;">소리를 듣고 뜻을 맞춰보세요</div>`;
                backEl.innerHTML = `<div style="font-size:2.2rem; font-weight:800; color:white; margin-bottom:15px; word-break: keep-all; overflow-wrap: anywhere;">${card.jp}</div><div style="font-size:1.6rem; font-weight:700; color:var(--star-color); word-break: keep-all; overflow-wrap: anywhere;">${card.kr}</div>`;
                setTimeout(() => speakCurrentWord(), 150);
            } else if (isAutoMode) {
                frontEl.innerText = card.jp; backEl.innerText = card.kr;
                adjustFontSize(frontEl, frontEl.innerText, true); adjustFontSize(backEl, backEl.innerText, false);
                setTimeout(() => autoPlaySequence(card), 150);
            } else {
                if (isKrFirst) { frontEl.innerText = card.kr; backEl.innerText = card.jp; } else { frontEl.innerText = card.jp; backEl.innerText = card.kr; }
                adjustFontSize(frontEl, frontEl.innerText, true); adjustFontSize(backEl, backEl.innerText, false);
            }
            
            const isS = deck.stars && deck.stars.includes(card.id);
            document.getElementById('starFront').innerText = isS ? "★" : "☆"; document.getElementById('starBack').innerText = isS ? "★" : "☆";
            document.getElementById('starFront').classList.toggle('active', isS); document.getElementById('starBack').classList.toggle('active', isS);
            resetCardUI();
        }

        function showComplete() { document.getElementById('complete-msg').innerText = `총 ${totalCount}개 학습 완료! 🎓`; document.getElementById('complete-modal').classList.add('visible'); }
        function openPauseModal() { clearAutoPlay(); saveSessionState(); document.getElementById('pause-modal').classList.add('visible'); }
        function closePauseModal() { document.getElementById('pause-modal').classList.remove('visible'); if(isAutoMode) updateCard(); }
        function markOk() { clearAutoPlay(); if (activeQueue.length === 0) return; activeQueue.shift(); saveSessionState(); updateProgress(); animateCardChange('ok'); }
        function markNo() { clearAutoPlay(); if (activeQueue.length === 0) return; activeQueue.push(activeQueue.shift()); saveSessionState(); animateCardChange('no'); }
        
        function toggleStar(e) {
            e.stopPropagation(); if (activeQueue.length === 0) return;
            const card = activeQueue[0]; const deck = isGlobalMode ? getDeckByCardId(card.id) : getDeck();
            if (!deck) return;
            if (!deck.stars) deck.stars = [];
            const idx = deck.stars.indexOf(card.id);
            if (idx > -1) deck.stars.splice(idx, 1); else deck.stars.push(card.id);
            saveAppData();
            const isS = deck.stars.includes(card.id);
            document.getElementById('starFront').innerText = isS ? "★" : "☆"; document.getElementById('starBack').innerText = isS ? "★" : "☆";
            document.getElementById('starFront').classList.toggle('active', isS); document.getElementById('starBack').classList.toggle('active', isS);
            if (!isGlobalMode) updateLobbyUI();
        }

        function goBackAndClearSession() { clearAutoPlay(); document.getElementById('complete-modal').classList.remove('visible'); clearSessionState(); if (isGlobalMode) { renderHomeUI(); showPage('home-page'); } else showPage('lobby-page'); }
        function goBackToLobby() { clearAutoPlay(); document.getElementById('pause-modal').classList.remove('visible'); if (isGlobalMode) { renderHomeUI(); showPage('home-page'); } else { updateLobbyUI(); showPage('lobby-page'); } }

        // --- 스와이프 애니메이션 ---
        const cw = document.getElementById('cardWrapper'); const ci = document.getElementById('cardInner'); const bgOverlay = document.getElementById('bg-overlay'); const bgIcon = document.getElementById('bg-icon');
        let startX = 0, currentX = 0, isDragging = false;
        
        document.getElementById('touchArea').addEventListener('touchmove', e => e.preventDefault(), { passive: false });
        
        cw.addEventListener('touchstart', e => { 
            if(e.target.closest('.star-toggle') || e.target.closest('.nav-btn') || e.target.closest('.tts-btn')) return; 
            if(isAutoMode) clearAutoPlay();
            isDragging = true; startX = e.touches[0].clientX; currentX = startX; cw.style.transition = 'none'; 
        }, { passive: false });
        
        cw.addEventListener('touchmove', e => {
            if (!isDragging) return; e.preventDefault(); currentX = e.touches[0].clientX; let dx = currentX - startX;
            cw.style.transform = `translateX(${dx}px) rotate(${dx * 0.05}deg)`;
            const prog = Math.min(Math.abs(dx) / (window.innerWidth * 0.4), 1); bgOverlay.style.opacity = 1;
            if (dx > 0) { bgOverlay.style.backgroundColor = `rgba(139, 195, 74, ${prog * 0.8})`; bgIcon.innerText = "O"; } else { bgOverlay.style.backgroundColor = `rgba(239, 83, 80, ${prog * 0.8})`; bgIcon.innerText = "X"; }
            bgIcon.style.transform = `scale(${0.5 + prog * 0.5})`;
        }, { passive: false });
        
        cw.addEventListener('touchend', e => {
            bgOverlay.style.opacity = 0; bgIcon.style.transform = 'scale(0.5)';
            if (!isDragging) return; isDragging = false; let dx = currentX - startX;
            if (Math.abs(dx) < 15) { isFlipped = !isFlipped; ci.style.transition = 'transform 0.5s cubic-bezier(0.4, 0, 0.2, 1)'; ci.classList.toggle('flipped', isFlipped); cw.style.transition = 'transform 0.3s'; cw.style.transform = 'translateX(0) rotate(0)'; }
            else if (Math.abs(dx) > 80) { if (dx > 0) markOk(); else markNo(); } else { cw.style.transition = 'transform 0.3s'; cw.style.transform = 'translateX(0) rotate(0)'; }
        });
        
        function animateCardChange(type) {
            const destX = type === 'ok' ? window.innerWidth + 200 : -window.innerWidth - 200;
            cw.style.transition = 'transform 0.25s ease-out'; cw.style.transform = `translateX(${destX}px) rotate(${type==='ok'?30:-30}deg)`;
            setTimeout(() => updateCard(), 250);
        }
        
        function resetCardUI() { isFlipped = false; ci.style.transition = 'none'; ci.classList.remove('flipped'); cw.style.transition = 'none'; cw.style.transform = 'translateX(0) rotate(0)'; void cw.offsetWidth; }
    </script>
</body>
</html>
